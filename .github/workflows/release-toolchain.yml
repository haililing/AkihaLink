name: Build pinned release toolchain

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image owner
        id: image
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable toolchain
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: release/toolchain.Dockerfile
          push: true
          tags: ghcr.io/${{ steps.image.outputs.owner }}/akihalink-release-toolchain:jdk21-go1.26.6-ndkr29-sdk36-v2
          provenance: mode=max
          sbom: true

      - name: Print release image pin
        run: |
          echo "Set repository variable AKIHALINK_RELEASE_IMAGE to:"
          echo "ghcr.io/${{ steps.image.outputs.owner }}/akihalink-release-toolchain@${{ steps.build.outputs.digest }}"
