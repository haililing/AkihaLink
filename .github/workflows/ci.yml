name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Go 1.26.7
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.7
          cache: false

      - name: Install Android NDK r29
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +e
          yes | "$sdkmanager" --install "ndk;29.0.14206865"
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          test "$sdkmanager_status" -eq 0
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(find core-overlay -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted" || {
            printf 'Unformatted Go files:\n%s\n' "$unformatted" >&2
            exit 1
          }

      - name: Module regression tests
        shell: pwsh
        run: ./scripts/test-module.ps1 -Core "$PWD/build/not-built"

      - name: Build Android arm64 core for compile checks
        shell: pwsh
        run: >-
          ./scripts/build-core.ps1
          -Ndk $env:ANDROID_NDK_HOME
          -Output "$PWD/build/ci/sing-box-android-arm64"

      - name: Load and attach eBPF programs on the runner kernel
        shell: bash
        working-directory: build/core-source
        run: |
          bash ../../scripts/verify-ebpf-kernel.sh "$PWD"

      - name: Run core observability and non-cgo compile checks
        shell: bash
        working-directory: build/core-source
        run: |
          go test -count=1 -tags with_ebpf,with_akihalink_observability \
            ./common/dialer ./common/ebpf ./protocol/ebpf ./protocol/akihalinkfallback ./experimental/akihalinkobs
          go test -race -count=1 -tags with_ebpf,with_akihalink_observability \
            ./common/dialer ./common/ebpf ./protocol/ebpf ./protocol/akihalinkfallback ./experimental/akihalinkobs
          CGO_ENABLED=0 GOOS=linux go test -run '^$' \
            -tags with_ebpf,with_akihalink_observability \
            ./common/dialer ./common/ebpf ./protocol/ebpf ./protocol/akihalinkfallback ./experimental/akihalinkobs

      - name: Android tests and lint
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug :baselineprofile:assemble

      - name: Validate generated configurations against pinned sing-box
        shell: bash
        working-directory: tools/configcheck
        run: |
          tags=with_quic,with_utls,with_clash_api,with_ebpf,with_akihalink_minimal_registry
          go run -mod=readonly -tags "$tags" . \
            ../../build/config-fixtures/global.json \
            ../../build/config-fixtures/rule.json \
            ../../build/config-fixtures/hybrid.json \
            ../../build/config-fixtures/all-protocols.json \
            ../../build/config-fixtures/speedtest.json
          if go run -mod=readonly -tags "$tags" . testdata/legacy-v14-fields.json; then
            echo "Pinned config checker accepted removed v14 eBPF fields" >&2
            exit 1
          fi

      - name: Verify rule lock
        shell: pwsh
        run: ./scripts/verify-rules.ps1
